name: Unpack Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q InsuranceGuide_ExternalDB_Final-1.zip -d extracted

          ROOT=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -1)

          cp -a "$ROOT"/. ./ \
            --exclude='.git' \
            --exclude='InsuranceGuide_ExternalDB_Final-1.zip' || true

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Extract InsuranceGuide project" || echo "Nothing to commit"
          git push
