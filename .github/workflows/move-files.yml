name: Move Project Files to Root

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move-files:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Move Files
      run: |
        SUBDIR=$(find . -maxdepth 1 -type d -name "*مشروع*" | head -n 1)
        if [ -n "$SUBDIR" ]; then
          echo "Found subdirectory: $SUBDIR"
          cp -rn "$SUBDIR"/* ./ || true
          cp -rn "$SUBDIR"/.* ./ 2>/dev/null || true
          rm -rf "$SUBDIR"
        fi

    - name: Commit and Push Changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "Move Android project files to root" || echo "Nothing to commit"
        git push

