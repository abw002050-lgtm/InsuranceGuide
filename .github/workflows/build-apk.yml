name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Auto Move Project Files to Root
      run: |
        if [ ! -f "gradlew" ]; then
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            echo "Found project at: $PROJECT_DIR"
            cp -rn "$PROJECT_DIR"/* ./ || true
            cp -rn "$PROJECT_DIR"/.* ./ 2>/dev/null || true
          fi
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: InsuranceGuide-APK
        path: app/build/outputs/apk/debug/*.apk
        
